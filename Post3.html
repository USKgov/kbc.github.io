        .menu-icon:hover { transform: scale(1.1); }

            z-index: 999;
            border-right: 3px solid #b80000;
        }
        .side-menu.open { transform: translateX(0); }
        .side-menu a {
            display: block;
            padding: 12px 24px;
            color: #1e1e1e;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: 0.3s;
            border-right: 3px solid transparent;
        }

            background: #fff0f0;
            color: #b80000;

        }
        .side-menu .menu-title {
            padding: 8px 24px;

            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #eee;
            margin-bottom: 8px;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            z-index: 998;
        }
        .overlay.show { opacity: 1; pointer-events: auto; }

            padding: 30px 40px;

        }

            margin: 20px 0;
